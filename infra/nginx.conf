# Defaults to 1, which quietly caps the whole stack at one core's worth of
# connections however many instances sit behind it.
worker_processes auto;

# Each worker needs two descriptors per proxied socket, plus headroom.
worker_rlimit_nofile 65536;

events {
  # Counts *both* ends of a proxied WebSocket: the browser's connection and the
  # one nginx opens to the upstream. The effective client limit is half this,
  # per worker. Left at the 512 default, a load test stops being a load test and
  # becomes a measurement of nginx refusing connections.
  worker_connections 16384;
}

http {
  # Round robin, deliberately. Sticky sessions (ip_hash) would keep each client
  # on one instance and save some cold room loads, but relying on that would
  # hide exactly the behaviour this setup exists to exercise: any client can be
  # served by any instance, and the Redis relay is what makes that true.
  upstream editor {
    server server-1:8080 max_fails=3 fail_timeout=10s;
    server server-2:8080 max_fails=3 fail_timeout=10s;
    server server-3:8080 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://editor;

      # The upgrade handshake needs HTTP/1.1 and these two headers passed
      # through verbatim. Without them nginx answers the WebSocket request as an
      # ordinary GET and the connection never becomes a socket.
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # A collaborative session is mostly silence. nginx's 60s default read
      # timeout would cut every idle editor loose, so this has to sit well above
      # the server's heartbeat interval rather than just above it -- the
      # heartbeat is the thing keeping the connection non-idle.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
