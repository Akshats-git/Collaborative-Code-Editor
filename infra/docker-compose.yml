# Three instances behind nginx. Free-tier hosting runs a single instance, so
# this is where cross-instance behaviour is actually exercised.
#
#   npm run stack:up
#   VITE_WS_URL=ws://localhost:8080 npm run dev -w @cce/web

name: cce

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cce
      POSTGRES_PASSWORD: cce
      POSTGRES_DB: cce
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, when the data directory is first created. The schema is
      # all `if not exists`, so there is nothing to undo if it runs again.
      - ../apps/server/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cce -d cce']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  server-1: &server
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 8080
      INSTANCE_ID: server-1
      DATABASE_URL: postgres://cce:cce@postgres:5432/cce
      REDIS_URL: redis://redis:6379
      # Identical everywhere on purpose: a token issued by one instance has to
      # verify on the next one the load balancer picks.
      AUTH_SECRET: local-development-secret
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  server-2:
    <<: *server
    environment:
      PORT: 8080
      INSTANCE_ID: server-2
      DATABASE_URL: postgres://cce:cce@postgres:5432/cce
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: local-development-secret
      CORS_ORIGIN: http://localhost:5173

  server-3:
    <<: *server
    environment:
      PORT: 8080
      INSTANCE_ID: server-3
      DATABASE_URL: postgres://cce:cce@postgres:5432/cce
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: local-development-secret
      CORS_ORIGIN: http://localhost:5173

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-1
      - server-2
      - server-3

volumes:
  pgdata:
