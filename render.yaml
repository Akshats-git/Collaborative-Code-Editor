# Render blueprint for the whole deployment: one service that serves the built
# client and holds its sockets open.
#
# It is not on Vercel because Vercel Functions cannot hold a connection open.
# Their WebSocket support inherits the function timeout, 60 seconds on Hobby,
# and a collaborative session is a socket that stays open for hours. Once you
# need a long-lived process anyway, having it serve the static bundle too costs
# nothing and removes an origin, a second deploy, and the CORS between them.
#
# Postgres and Redis are not defined here on purpose. Both are optional, and
# unset means documents live in memory for the life of the process.

services:
  - type: web
    name: cce-server
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    # The build needs the workspace root, not just apps/server.
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # Generated once and then held by Render. Every instance must share it, so
      # if this ever scales past one instance, promote it to an env group.
      - key: AUTH_SECRET
        generateValue: true
      # Both optional, both set in the dashboard. DATABASE_URL needs
      # ?sslmode=require for Neon. REDIS_URL only does anything with more than
      # one instance, which the free plan does not give you.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
